<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Кубик · Handy</title>
  <link rel="stylesheet" href="../shared/styles.css">
  <script type="module" src="dice.js"></script>
</head>
<body>
  <main class="shell utility-shell">
    <header class="intro">
      <h1>Кубик</h1>
      <p id="description"></p>
    </header>
    <p id="notice" class="notice" role="status">Загружаю настройки…</p>
    <section id="report" class="card" aria-labelledby="dice-heading" hidden>
      <div class="card-heading">
        <h2 id="dice-heading">Выпавшие значения</h2>
        <span class="badge" id="dice-shape"></span>
      </div>
      <div class="dice-settings" role="group" aria-label="Настройки броска">
        <div class="dice-fields">
          <label for="dice-count">Кубиков
            <input type="number" id="dice-count" min="1" max="20" step="1" inputmode="numeric" autocomplete="off">
          </label>
          <label for="dice-sides">Граней на кубике
            <input type="number" id="dice-sides" min="2" max="1000" step="1" inputmode="numeric" autocomplete="off">
          </label>
        </div>
        <div class="choice dice-presets" role="group" aria-label="Стандартные кубики">
          <button type="button" data-sides="4" aria-pressed="false">d4</button>
          <button type="button" data-sides="6" aria-pressed="false">d6</button>
          <button type="button" data-sides="8" aria-pressed="false">d8</button>
          <button type="button" data-sides="10" aria-pressed="false">d10</button>
          <button type="button" data-sides="12" aria-pressed="false">d12</button>
          <button type="button" data-sides="20" aria-pressed="false">d20</button>
          <button type="button" data-sides="100" aria-pressed="false">d100</button>
        </div>
      </div>
      <ul class="dice-values" id="dice-values" role="list"></ul>
      <div class="dice-result">
        <p role="status" id="dice-summary"></p>
        <button type="button" class="primary" id="roll-again">Бросить</button>
      </div>
    </section>
    <p class="source">Настройки · <a href="data.json">data.json</a></p>
  </main>
</body>
</html>
